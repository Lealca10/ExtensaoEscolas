spring.application.name=ExtensaoEscolas
server.port=8080

# Configurações do MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/disciplina_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=seu_usuario
spring.datasource.password=sua_senha

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configurações de Email (para recuperação de senha)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu-email@gmail.com
spring.mail.password=sua-senha-app
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT
jwt.secret=seuSegredoSuperSecretoParaJWTAquiUseUmaChaveLongaESegura
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:8080